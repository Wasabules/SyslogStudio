name: Release

on:
  push:
    tags: ["v*"]

# The three build jobs run untrusted third-party code (npm packages, Go
# modules, the Wails CLI) and only need to read the repo. Write access is
# granted to the `release` job alone, which is what publishes the signed
# assets — so a compromised build dependency cannot rewrite the repository or
# tamper with an existing release.
permissions:
  contents: read

# Nothing in this workflow is restored from a cache: not Go's module and build
# caches, not npm's, not a compiled Wails CLI. Caches are written by CI runs,
# which run every pull request's dependencies, and whatever one of them left
# there would be compiled into a signed release. Every byte comes from the Go
# module proxy and the npm registry instead, checked against go.sum and
# package-lock.json; it costs about a minute a build, once per release.
#
# Each job has a time limit: GitHub's default of six hours would let a stuck
# build hold the release, and a macOS runner, for the whole of it.

# Asset names are FIXED (no version in the filename) so the in-app updater can
# match them by constant name across releases:
#   SyslogStudio-windows-amd64.exe          raw exe   (self-update, portable)
#   SyslogStudio-windows-amd64-setup.exe    NSIS installer
#   SyslogStudio-windows-amd64.zip          portable zip (manual download)
#   SyslogStudio-macos-universal.dmg        DMG (manual download / macOS update)
#   SyslogStudio-macos-universal.zip        zipped .app
#   SyslogStudio-linux-amd64                raw binary (self-update, portable)
#   SyslogStudio-linux-amd64.deb            Debian package
#   SyslogStudio-linux-amd64.tar.gz         portable tarball
#   SyslogStudio-checksums.txt(.sig)        SHA-256 manifest + Ed25519 signature

jobs:
  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 requires ^20.19 || >=22.12. Pinning the major to 22 rather
          # than 20 keeps that satisfied without depending on which 20.x the
          # runner happens to resolve.
          node-version: "22"
          package-manager-cache: false
      - name: Install NSIS
        # Pinned: the installer that ships is built by this makensis, and an
        # unpinned install takes whatever Chocolatey serves that day. Bumped by
        # hand, since Dependabot does not read a `run:` step.
        run: |
          choco install nsis -y --version 3.13.0
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Verify NSIS
        run: makensis /VERSION
      - name: Install Wails
        # The version go.mod requires of wails/v2, compiled from source: this
        # CLI produces the binaries that are then checksummed and signed, so it
        # comes from the module proxy, checked against go.sum, never from a
        # cache (see the top of this file).
        uses: ./.github/actions/wails-cli
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Set product version from tag
        shell: bash
        run: |
          # Propagate the release tag into wails.json so NSIS embeds the real
          # version in the Add/Remove Programs registry (DisplayVersion) and in
          # the exe's VERSIONINFO. Without this, Wails falls back to its default
          # "1.0.0" regardless of the tag (issue #3).
          v="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$v" '.info.productVersion = $v' wails.json > "$tmp" && mv "$tmp" wails.json
          echo "wails.json info.productVersion set to $v"
      - name: Build with NSIS
        # The tag reaches the build through the environment, never as a
        # github.ref_name expression written into the script: an expression is
        # pasted into the script's source before the shell reads it, so a tag
        # named to look like code would run as code. Only maintainers can push
        # a tag; this keeps the tag data whoever names it. Same in every job.
        run: wails build -nsis -ldflags "-X SyslogStudio/internal/updater.AppVersion=$env:GITHUB_REF_NAME"
      - name: Package assets
        shell: bash
        run: |
          cp build/bin/SyslogStudio.exe SyslogStudio-windows-amd64.exe
          mv build/bin/*installer*.exe SyslogStudio-windows-amd64-setup.exe
          powershell -Command "Compress-Archive -Path build/bin/SyslogStudio.exe -DestinationPath SyslogStudio-windows-amd64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-amd64
          path: |
            SyslogStudio-windows-amd64.exe
            SyslogStudio-windows-amd64-setup.exe
            SyslogStudio-windows-amd64.zip

  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Wails
        # The version go.mod requires of wails/v2, compiled from source: this
        # CLI produces the binaries that are then checksummed and signed, so it
        # comes from the module proxy, checked against go.sum, never from a
        # cache (see the top of this file).
        uses: ./.github/actions/wails-cli
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Set product version from tag
        shell: bash
        run: |
          # Same as the Windows job: propagate the tag into wails.json so the
          # macOS bundle's CFBundleShortVersionString reflects the real version
          # instead of Wails's default "1.0.0".
          v="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$v" '.info.productVersion = $v' wails.json > "$tmp" && mv "$tmp" wails.json
          echo "wails.json info.productVersion set to $v"
      - name: Build
        run: wails build -platform darwin/universal -ldflags "-X SyslogStudio/internal/updater.AppVersion=$GITHUB_REF_NAME"
      - name: Package assets
        run: |
          (cd build/bin && zip -r "../../SyslogStudio-macos-universal.zip" SyslogStudio.app)
          mkdir -p dmg-staging
          cp -r build/bin/SyslogStudio.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "SyslogStudio" -srcfolder dmg-staging -ov -format UDZO \
            "SyslogStudio-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: |
            SyslogStudio-macos-universal.zip
            SyslogStudio-macos-universal.dmg

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        # Normally done in well under a minute. The runner's Ubuntu mirror once
        # crawled at 20 kB/s and held the v1.7.0 release for half an hour: the
        # action moves to archive.ubuntu.com when it does, and the limit is for
        # a network that does not answer at all.
        timeout-minutes: 15
        uses: ./.github/actions/linux-deps
      - name: Install Wails
        # The version go.mod requires of wails/v2, compiled from source: this
        # CLI produces the binaries that are then checksummed and signed, so it
        # comes from the module proxy, checked against go.sum, never from a
        # cache (see the top of this file).
        uses: ./.github/actions/wails-cli
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build
        run: wails build -tags webkit2_41 -ldflags "-X SyslogStudio/internal/updater.AppVersion=$GITHUB_REF_NAME"
      - name: Package assets
        run: |
          cp build/bin/SyslogStudio SyslogStudio-linux-amd64
          tar -czf "SyslogStudio-linux-amd64.tar.gz" -C build/bin SyslogStudio
          DEB_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps
          cp build/bin/SyslogStudio pkg/usr/bin/syslogstudio
          chmod 755 pkg/usr/bin/syslogstudio
          cp build/linux/syslogstudio.desktop pkg/usr/share/applications/
          cp build/appicon.png pkg/usr/share/icons/hicolor/256x256/apps/syslogstudio.png
          cat > pkg/DEBIAN/control << EOF
          Package: syslogstudio
          Version: ${DEB_VERSION}
          Section: utils
          Architecture: amd64
          Maintainer: Geoffrey Lecoq
          Description: Lightweight desktop syslog viewer and analyzer
           Multi-protocol syslog server (UDP, TCP, TLS) with real-time log viewing,
           filtering, alerts, and statistics dashboard.
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Recommends: pkexec | policykit-1
          EOF
          # An upgrade replaces the executable the system service runs:
          # restart it, so the service and the window are the same version.
          cat > pkg/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          if [ -d /run/systemd/system ] && systemctl is-active --quiet syslogstudio.service; then
            systemctl restart syslogstudio.service || true
          fi
          EOF
          # Removing the package removes what the service runs: remove the
          # service too, keeping its data. An upgrade leaves it be.
          cat > pkg/DEBIAN/prerm << 'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = remove ] && [ -f /etc/systemd/system/syslogstudio.service ]; then
            /usr/bin/syslogstudio service uninstall || true
          fi
          EOF
          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/prerm
          dpkg-deb --build pkg "SyslogStudio-linux-amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64
          path: |
            SyslogStudio-linux-amd64
            SyslogStudio-linux-amd64.deb
            SyslogStudio-linux-amd64.tar.gz

  release:
    name: Create release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance: id-token to get the OIDC token that proves the
      # attestation came from this workflow run, attestations to record it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: |
          # The first line binds the signed manifest to this release tag; the
          # app rejects a manifest whose version doesn't match (replay guard).
          {
            echo "version ${GITHUB_REF_NAME}"
            sha256sum SyslogStudio-windows-* SyslogStudio-macos-* SyslogStudio-linux-*
          } > SyslogStudio-checksums.txt
      - name: Sign checksums
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "::error::UPDATER_PRIVATE_KEY secret is not set; releases must be signed." >&2
            exit 1
          fi
          go run ./tools/updatersign sign artifacts/SyslogStudio-checksums.txt
          test -s artifacts/SyslogStudio-checksums.txt.sig
      # The updater's own judgement, before anything is published: the
      # signature against the public key the app embeds, the version line
      # against this tag, one entry per asset and every SHA-256. A signing key
      # rotated without internal/updater/verify.go would otherwise publish a
      # release every installed copy refuses, and an asset missing from the
      # manifest one that a whole system cannot update to; the job stops here
      # instead. The release skill's check after publishing stays: it reads
      # what GitHub actually serves.
      - name: Verify as the updater will
        run: go run ./tools/updatersign verify artifacts "$GITHUB_REF_NAME"
      # Signed, verifiable provenance for every published asset: which workflow,
      # which commit, which runner produced these exact bytes. It answers a
      # question the Ed25519 manifest signature does not — that signature proves
      # the checksums were signed by the holder of the release key, not that the
      # binaries were built from this repository by this workflow.
      #
      # Anyone can check a download without trusting this repo's tooling:
      #   gh attestation verify SyslogStudio-windows-amd64.exe --repo Wasabules/SyslogStudio
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/SyslogStudio-windows-amd64.exe
            artifacts/SyslogStudio-windows-amd64-setup.exe
            artifacts/SyslogStudio-windows-amd64.zip
            artifacts/SyslogStudio-macos-universal.dmg
            artifacts/SyslogStudio-macos-universal.zip
            artifacts/SyslogStudio-linux-amd64
            artifacts/SyslogStudio-linux-amd64.deb
            artifacts/SyslogStudio-linux-amd64.tar.gz

      - name: List release assets
        run: ls -lh artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: artifacts/*
