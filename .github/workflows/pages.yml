# Publish docs/ to GitHub Pages.
#
# The site is committed, not generated here: docs/demo/ is built by
# `node tools/demo.mjs` and the screenshots by `node tools/screenshots.mjs`,
# both run deliberately by a person who then looks at the result. Building them
# in CI would mean a page could change because a dependency moved, with nobody
# having seen it.
#
# What this job does check is that the committed site is coherent — that the
# demo is present and that no page links to a file that is not there. A broken
# link is the one kind of rot a static site accumulates silently.
#
# Actions are pinned by commit SHA, like every other workflow here. A tag is a
# label its owner can move; a SHA is the code that was reviewed. Dependabot is
# what keeps the pins from rotting — see .github/dependabot.yml.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way: a cancelled deploy
# can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The demo must be built
        run: |
          test -f docs/demo/index.html || {
            echo "docs/demo/index.html is missing — run: node tools/demo.mjs"
            exit 1
          }

      - name: No page may link to a file that is not there
        run: node tools/check-links.mjs

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
