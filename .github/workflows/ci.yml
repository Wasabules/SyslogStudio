name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository. Declared explicitly so the workflow does not
# inherit whatever default the repository settings grant.
permissions:
  contents: read

# Superseded pushes to the same pull request are pointless work. Pushes to main
# are never cancelled: every commit on the default branch gets its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full application build, on every platform we ship. This is deliberately
  # `wails build` and not a bare `go build`: the CLI regenerates the JS bindings
  # and builds the frontend before compiling, so this is the only check that
  # covers the whole pipeline the release workflow runs. Without it, CI can be
  # green while `wails build` is broken, and the breakage only surfaces when a
  # tag is pushed — which is to say, when it is already a failed release.
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A test that hangs (on a pipe, a service, a lock) would otherwise hold the
    # runner for GitHub's default of six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, so the toolchain has exactly one source of truth.
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 requires ^20.19 || >=22.12. Pinning the major to 22 rather
          # than 20 keeps that satisfied without depending on which 20.x the
          # runner happens to resolve.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Falls back to archive.ubuntu.com when the runner's mirror crawls (see
        # the action); the limit is for a network that does not answer at all.
        timeout-minutes: 15
        uses: ./.github/actions/linux-deps

      - name: Install Wails CLI
        # The version go.mod requires of wails/v2 (see the action), cached:
        # what CI builds is checked, never shipped.
        uses: ./.github/actions/wails-cli
        with:
          cache: "true"

      - name: Build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tags=()
          if [ "$RUNNER_OS" = "Linux" ]; then tags=(-tags webkit2_41); fi
          wails build -platform "$PLATFORM" "${tags[@]}"

      - name: Vet & test
        shell: bash
        run: |
          tags=()
          if [ "$RUNNER_OS" = "Linux" ]; then tags=(-tags webkit2_41); fi
          # The race detector runs on Linux and Windows, not on macOS. It
          # instruments every memory access, and two things here make a great
          # many: SQLite, which modernc translates from C into Go, and Argon2,
          # whose amd64 assembly has no arm64 counterpart. On the arm64 macOS
          # runners internal/engine took 471 s under it against 110 s on Linux,
          # and the job twelve minutes against five. The code the detector
          # watches is shared, and the other two systems run it; macOS still
          # runs every test, its own code included.
          race=(-race)
          if [ "$RUNNER_OS" = "macOS" ]; then race=(); fi
          go vet "${tags[@]}" ./...
          go test "${tags[@]}" "${race[@]}" -count=1 ./...

  quality:
    name: Quality (lint, types, tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Formatting
        # Neither go vet nor staticcheck checks gofmt, so nothing here did.
        # Runs before `npm ci` on purpose: gofmt -l walks the tree, and
        # node_modules has no business being in that walk.
        #
        # Note for anyone reproducing this on Windows: a local run flags extra
        # files because the working copy is CRLF while gofmt expects LF. That is
        # a checkout artefact, not a formatting problem — the repository stores
        # LF via .gitattributes, which is what this job sees.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Workflows
        # The release workflow runs only when a tag is pushed, which is to say
        # once it is already a release. actionlint reads every workflow now:
        # expressions, job and step references, the inputs given to actions,
        # and each `run:` script through shellcheck (installed on the runner).
        # A mistake in a workflow is found on the pull request that makes it.
        # Pinned, like staticcheck below and for the same reason.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

      - name: Install Linux dependencies
        timeout-minutes: 15
        uses: ./.github/actions/linux-deps

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Svelte type check
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
        working-directory: frontend

      - name: Frontend tests
        # The live view's half of the search engine, held to the files that
        # internal/search checks against SQLite's FTS5: the live view and the
        # history must find the same messages.
        run: npm test
        working-directory: frontend

      # main.go carries `//go:embed all:frontend/dist`, and frontend/dist is
      # gitignored, so anything that compiles the main package fails with
      # "pattern all:frontend/dist: no matching files found" before it analyses a
      # line. staticcheck stops outright; govulncheck is worse — it carries on
      # and silently reports on the subpackages alone, so main would look clean
      # because it was never looked at. A placeholder rather than a real frontend
      # build: neither tool inspects the bytes the binary embeds, and the build
      # job already compiles the real thing on all three platforms.
      - name: Placeholder for the embedded frontend
        run: |
          mkdir -p frontend/dist
          echo '<!-- CI placeholder -->' > frontend/dist/index.html

      - name: Staticcheck
        # Catches what go vet does not: dead stores, misused stdlib contracts,
        # simplifications that hide intent.
        #
        # Pinned, unlike govulncheck below. A linter that floats can fail a
        # commit that changed nothing, because a newly added check fired — the
        # finding may well be real, but it should arrive in its own deliberate
        # bump, not as a surprise on someone else's pull request. Dependabot
        # does not track versions inside a `run:` step, so this is bumped by
        # hand.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck -tags webkit2_41 ./...

      - name: go.mod is tidy
        # A stale go.mod/go.sum means the dependency set that CI resolves is not
        # the one recorded in the repo, so every other check here is verifying
        # something slightly different from what a release builds.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The known-vulnerability scans (govulncheck, npm audit) are in security.yml,
  # which runs on pull requests and pushes as well, and every week besides.

  # Blocks a pull request that introduces a dependency carrying a known
  # advisory. govulncheck cannot do this: it reports on what is already merged.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
