version: 2

# Dependabot is what makes SHA-pinned actions maintainable. Pinning without it
# means the pins rot: an action stays frozen at whatever commit was current the
# day someone wrote it, security fixes included.
#
# This covers version updates. Dependabot *security* updates (the automatic PRs
# for a newly disclosed advisory) are a separate repository setting and are
# already enabled.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # golang.org/x/* move together and are almost always safe; one PR rather
      # than five keeps the noise down without hiding anything.
      golang-x:
        patterns:
          - golang.org/x/*

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Svelte toolchain moves as a unit — svelte, svelte-check,
      # svelte-preprocess and the Vite plugin are version-locked against each
      # other, so separate PRs for them just fail each other's CI.
      svelte-toolchain:
        patterns:
          - svelte
          - svelte-*
          - "@sveltejs/*"
          - vite

  # frontend/package.json also carries one npm `override`, which Dependabot
  # does not manage and which is easiest to understand from here: esbuild is
  # forced to ^0.25.0 inside svelte-i18n's subtree. svelte-i18n 4.0.1 is the
  # latest release and pins esbuild ^0.19.2, which carries
  # GHSA-67mh-4wv8-2f99 — esbuild's development server answering cross-origin
  # requests. Nothing here runs that server: esbuild belongs to svelte-i18n's
  # message-extraction CLI, no script invokes it, and the project imports only
  # the runtime API. The override is hygiene, not a fix for live exposure, and
  # it can go the day svelte-i18n moves off 0.19.

  # The workflows pin actions by commit SHA, so this is the only thing that
  # ever moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and .../analyze are ONE action released as
      # one version, and CodeQL refuses to analyse when the two do not match.
      # Ungrouped, Dependabot opened a PR for each half — and neither could
      # ever go green, because each one on its own is the mismatch. They have
      # to move together or not at all.
      codeql:
        patterns:
          - github/codeql-action*
